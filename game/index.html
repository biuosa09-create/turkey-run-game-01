<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Dash — Turkey's Great Escape</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1d0e; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, 177.78vh); height: min(100vh, 56.25vw); display: block; touch-action: none; background: #f7c873; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720" aria-label="Gobble Dash: help Gertie the turkey escape Farmer Bram — jump, duck and dash past fences, pumpkins, knives and the oven"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
